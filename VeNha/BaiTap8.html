<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bat Family</title>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 0;
            background-color: #ffffff;
        }

        #root {
            width: 1024px;
            margin: 0 auto;
        }

        ul.superheroes {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #site-header {
            text-align: center;
            margin: 0 0 30px 0;
            padding: 15px 0;
            background-color: #d3d3d3;
            background-image: url("imgs/logo.png");
            background-repeat: no-repeat;
            background-position: center left 38%;
            background-size: 45px auto;
            color: #333333;
            text-shadow: 2px 2px 4px #ffffff;
            font-size: 28px;
            font-weight: bold;
        }

        #site-header span {
            display: inline-block;
            margin-left: 20px;
        }

        .superheroes li {
            width: 180px;
            display: inline-block;
            position: relative;
            transition: width 0.3s ease;
        }

        .hero-header {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #7a8288;
            font-size: 16px;
            font-weight: bold;
            z-index: 2;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            transition: color 0.3s ease;
        }

        .superheroes li img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
            border: 1px solid transparent;
        }

        .superheroes li a {
            display: none;
            width: 100%;
            color: #ffffff;
            text-decoration: none;
            background-color: #555555;
            text-align: center;
            padding: 8px 0;
            margin-top: 6px;
            font-size: 13px;
        }

        .superheroes li:hover a {
            display: block;
            text-decoration: underline;
        }

        .superheroes li:hover {
            width: 215px;
        }

        .superheroes li:hover .hero-header {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="root">
        <h1 id="site-header"><span>The Bat family</span></h1>
        <ul class="superheroes">
            <li>
                <strong class="hero-header">Batman</strong>
                <img src="imgs/superhero-1.jpg" alt="Batman">
                <a href="https://en.wikipedia.org/wiki/Batman">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batwing</strong>
                <img src="imgs/superhero-2.jpg" alt="Batwing">
                <a href="https://en.wikipedia.org/wiki/Batwing_(DC_Comics)">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batgirl</strong>
                <img src="imgs/superhero-3.jpg" alt="Batgirl">
                <a href="https://en.wikipedia.org/wiki/Batgirl">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Nightwing</strong>
                <img src="imgs/superhero-4.jpg" alt="Nightwing">
                <a href="https://en.wikipedia.org/wiki/Nightwing">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Red Robin</strong>
                <img src="imgs/superhero-5.jpg" alt="Red Robin">
                <a href="https://en.wikipedia.org/wiki/Red_Robin_(comics)">Read more</a>
            </li>
        </ul>
    </div>
</body>
</html>
