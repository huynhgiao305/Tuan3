<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bài tập 7 - Layout</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 20px; font-family: Arial, sans-serif; font-size: 20px; }
  #wrapper { width: 300px; margin: 0 auto; border: 2px solid #000; padding: 6px; box-shadow: 12px 12px 12px #999; background: #fff; overflow: hidden; }
  header, nav, main, footer { border: 2px solid #000; padding: 4px 6px; }
  header { height: 46px; margin-bottom: 6px; }
  nav { float: left; width: 50px; height: 210px; }
  main { margin-left: 56px; height: 210px; }
  footer { clear: both; height: 36px; margin-top: 6px; }
</style>
</head>
<body>
<div id="wrapper">
<header>header</header>
<nav>nav</nav>
<main>main</main>
<footer>footer</footer>
</div>
</body>
</html>
